<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La mia spesa">
  <link rel="manifest" href="manifest.json">
  <title>La mia spesa</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="app-shell">
    <section class="home-screen">
      <div class="hero">
        <p class="eyebrow">LA MIA SPESA</p>
        <p class="subtitle">Crea una nuova lista, consulta le spese precedenti o tieni d'occhio ciò che è finito.</p>
      </div>

      <div class="actions" aria-label="Azioni principali">
        <button class="action-card action-primary" id="newShoppingBtn" type="button">
          <span class="action-icon" aria-hidden="true">🛒</span>
          <span class="action-text">
            <strong>Nuova spesa</strong>
            <small>Crea una nuova lista</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button class="action-card action-secondary" id="remindersBtn" type="button">
          <span class="action-icon" aria-hidden="true">🔔</span>
          <span class="action-text">
            <strong>Promemoria</strong>
            <small>Prodotti finiti da riacquistare</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button class="action-card action-secondary" id="historyBtn" type="button">
          <span class="action-icon" aria-hidden="true">🕘</span>
          <span class="action-text">
            <strong>Storico</strong>
            <small>Rivedi le spese passate</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>
      </div>

      <p class="footer-note">Tutto semplice. Tutto sotto controllo.</p>
    </section>

    <section class="reminders-panel" id="remindersPanel" aria-hidden="true">
      <div class="panel-backdrop" id="closeReminders"></div>

      <div class="panel-sheet" role="dialog" aria-modal="true" aria-labelledby="remindersTitle">
        <div class="panel-handle"></div>

        <div class="panel-header">
          <div>
            <p class="eyebrow">PROMEMORIA</p>
            <h1 id="remindersTitle">Da riacquistare</h1>
          </div>
          <button class="close-btn" id="closeRemindersBtn" type="button" aria-label="Chiudi">×</button>
        </div>

        <div class="reminders-empty">
          <span class="empty-icon" aria-hidden="true">🔔</span>
          <h2>Nessun prodotto da ricordare</h2>
          <p>Quando un prodotto finirà, potremo aggiungerlo qui per ricordarti di riacquistarlo.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
