<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>La mia spesa</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="app-shell">
    <section class="home-screen">
      <div class="hero">
        <p class="eyebrow">LA MIA SPESA</p>
        <h1>Organizza la tua spesa.<br>Con semplicità.</h1>
        <p class="subtitle">Crea una nuova lista oppure consulta le spese precedenti.</p>
      </div>

      <div class="actions" aria-label="Azioni principali">
        <button class="action-card action-primary" id="newShoppingBtn" type="button">
          <span class="action-icon" aria-hidden="true">🛒</span>
          <span class="action-text">
            <strong>Nuova spesa</strong>
            <small>Crea una nuova lista</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>

        <button class="action-card action-secondary" id="historyBtn" type="button">
          <span class="action-icon" aria-hidden="true">🕘</span>
          <span class="action-text">
            <strong>Storico</strong>
            <small>Rivedi le spese passate</small>
          </span>
          <span class="action-arrow" aria-hidden="true">›</span>
        </button>
      </div>

      <p class="footer-note">Tutto semplice. Tutto sotto controllo.</p>
    </section>
  </main>
</body>
</html>
